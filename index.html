const PAGE = document.getElementById("sitemain"),
	TOC = document.getElementById("sitenav"),
	PERCENTAGE = document.getElementById("percentage"),
	BAR = document.getElementById("completion"),
	FRACTION = document.getElementById("gcurrent"),
	STATE = [], STORAGEKEY = "hadescompletionprogress";

// Load existing data
try {
	Object.assign(STATE, JSON.parse(localStorage.getItem(STORAGEKEY)));
} catch (e) { /*no data*/ }

// Start calculating page data
let inputCount = 0, TOTAL = 0;

// Create page
DATA.forEach(({ id, name, format, tiers, label, groups }) => {
	const section = document.createElement("section"),
		heading = document.createElement("h2");
	section.id = id;
	section.classList.add("section");
	heading.innerText = name;
	section.append(heading);
	section._total = 0;

	groups.forEach((gData, gIndex) => addGroup({ format, tiers, label, ...gData}, gIndex, section));

	// Add TOC link
	const link = document.createElement("a");
	link.href = `#${id}`;
	link.innerText = { prophecies: "Prophecies", keepsakes: "Keepsakes" }[id] ?? name;
	TOC.append(link);

	makeProgressMarker(section, heading, link);
	TOTAL += section._total;
	PAGE.append(section);
})


// Set up global tracker
delete (STATE[TOTAL - 1] = 0);	// hacky way to get to the proper length
document.getElementById("gtotal").replaceWith(TOTAL);
BAR.max = TOTAL;
updateGlobal();


// #region Rendering
function addGroup({ name, format, tiers, items, label }, index, section) {
	const group = document.createElement("details");
	group.name = section.id;
	group.id = `${section.id}-${index}`;
	group.classList.add("dropdown");

	const heading = document.createElement("summary");
	heading.innerText = name;
	group.append(heading);

	const btns = document.createElement("div"),
		btn1 = document.createElement("button"),
		btn2 = document.createElement("button");
	btns.classList.add("markall");
	btn1.type = btn2.type = "button";
	btn1.classList.add("yes");
	btn2.classList.add("no");
	btn1.innerText = "Complete All";
	btn2.innerText = "Reset All";
	btn1.addEventListener("click", () => setAllInputs(group, true))
	btn2.addEventListener("click", () => setAllInputs(group, false))
	btns.append(btn1, btn2);
	group.append(btns);

	group._total = 0;

	items.forEach(iData => {
		const [element, iTotal] = makeItem(iData, `row${inputCount}`, iData.format ?? format, iData.tiers ?? tiers, iData.label ?? label);
		group.append(element);
		group._total += iTotal;
	})

	makeProgressMarker(group, heading);
	section.append(group);
	section._total += group._total;
}

function makeItem(data, id, format, tiers, label) {
	let t = 0;

	const item = document.createElement(["boolean", "number"].includes(format) ? "label" : "div");
	item.classList.add("item");
	item.id = id;

	const heading = document.createElement("p");
	heading.classList.add("label");
	heading.innerText = data.name;
	if (data.hidden) heading.classList.add("hidden");
	item.append(heading);

	if (!!data.description) {
		const desc = document.createElement("p");
		desc.classList.add("subtitle");
		desc.innerText = data.description;
		item.append(desc);
	}

	switch (format) {
		case "boolean":
		default:
			item.appendChild(makeCheckbox(true));
			t = 1;
			break;

		case "getmax":
			makeCheckboxes(item, label ?? ["Discovered", "Completed"]);
			t = 2;
			break;

		case "upgrades":
			makeCheckboxes(item, !!tiers ? (new Array(tiers)).fill(0).map((_, i) => 
				!!label
				? label.replace("%s", i + 1)
				: "★".repeat(i + 1)
			) : label, data.special);
			t = tiers ?? label.length;
			break;

		case "number":
			item.append(makeNumber(tiers));
			t = tiers;
			break;
	}

	// Mark completion on pageload
	const last = Array.from(item.querySelectorAll("input")).at(-1);
	if (last.type === "number")
		toggleItem(last, parseInt(last.value) === parseInt(last.max));
	else toggleItem(last.parentElement.classList.contains("tier") ? last.parentElement : last, last.checked);

	return [item, t];
}

function makeCheckbox(togglesParent = false) {
	const input = document.createElement("input");
	input.setAttribute("type", "checkbox");
	input.checked = Boolean(STATE[inputCount]);
	input.id = `i${inputCount++}`;

	if (togglesParent)
		input.addEventListener("change", e => {
			toggleItem(e.currentTarget, e.currentTarget.checked);
			updateProgress(input);
		})

	return input;
}

function makeCheckboxes(container, labels, special = []) {
	const wrapper = document.createElement("div");
	wrapper.classList.add("boxes");

	labels.forEach((l, i) => {
		const label = document.createElement("label"),
			span = document.createElement("span");
		label.classList.add("tier");

		// Mark levels when you get gifts
		if (special.includes(i + 1)) label.classList.add("special");

		span.innerText = l;
		span.classList.add("text")
		label.append(makeCheckbox(), span);

		label.firstElementChild.addEventListener("change", e => {
			let sibling;
			if (!!(sibling = label.previousElementSibling) && e.currentTarget.checked) {
				sibling.firstElementChild.checked = true;
				sibling.firstElementChild.dispatchEvent(new Event("change"));
			}
			else if (!!(sibling = label.nextElementSibling) && !e.currentTarget.checked) {
				sibling.firstElementChild.checked = false;
				sibling.firstElementChild.dispatchEvent(new Event("change"));
			}

			toggleItem(label, e.currentTarget.checked);

			updateProgress(label.firstElementChild);
		})

		wrapper.append(label);
	})

	container.append(wrapper);
}

function toggleItem(label, completed) {
	if (!label.nextElementSibling)
		label.closest(".item").classList[completed ? "add" : "remove"]("checked");
}

function makeNumber(max) {
	const input = document.createElement("input");
	input.type = "number";
	input.value = Math.floor(STATE[inputCount] || 0);
	input.id = `i${inputCount++}`;
	input.min = 0;
	input.max = max;
	input.step = 1;

	input.addEventListener("change", e => {
		e.currentTarget.closest(".item").classList[
			parseInt(e.currentTarget.value) === max
			? "add"
			: "remove"
		]("checked");
		updateProgress(input)
	})

	return input;
}

function makeProgressMarker(tracked, ...containers) {
	tracked._progress = [];

	const wrapper = document.createElement("span");
	wrapper.classList.add("progress");
	const current = document.createElement("span");
	wrapper.append(current, `/${tracked._total}`);

	containers.forEach((el, i) => {
		el.append(i < 1 ? wrapper : wrapper.cloneNode(true))
		tracked._progress.push(el.lastElementChild.firstElementChild);
	});

	updateProgress(tracked.querySelector("input"));
}
// #endregion Rendering



// #region Tracking
function updateProgress(input) {
	STATE[Number(input.id.slice(1))] = getValue(input);

	[
		input.closest(".dropdown"),
		input.closest(".section"),
	].filter(el => !!el).forEach(section => {
		const sum = Array
			.from(section.querySelectorAll("input"))
			.map(i => getValue(i))
			.reduce((sum, curr) => sum + curr, 0);
		section._progress.forEach(el => {
			el.innerText = sum;

			el.closest("a")?.setAttribute("style", `--completion: ${((sum / section._total) * 100).toFixed(2)}%`);
		})
	});

	updateGlobal();
}

function updateGlobal() {
	if (!TOTAL) return;
	const current = STATE.reduce((sum, curr) => !!curr ? sum + curr : sum, 0);

	FRACTION.innerText = current;
	BAR.value = current;
	PERCENTAGE.innerText = `${((current / TOTAL) * 100).toFixed(2)}%`;

	localStorage.setItem(STORAGEKEY, JSON.stringify(STATE).replaceAll("null", "0"));
}

function getValue(input) {
	return Number(input.type === "checkbox" ? input.checked : Math.floor(input.value));
}

const RESET = document.getElementById("reset1"),
	CONFIRM_RESET = document.getElementById("reset2");
RESET.addEventListener("click", () => {
	RESET.disabled = true;
	CONFIRM_RESET.disabled = false;

	CONFIRM_RESET._revert = setTimeout(() => {
		if (CONFIRM_RESET.disabled) return;
		RESET.disabled = false;
		CONFIRM_RESET.disabled = true;
	}, 5000);
})
document.getElementById("reset2").addEventListener("click", () => {
	clearTimeout(CONFIRM_RESET._revert);

	setAllInputs(PAGE, true);

	RESET.disabled = false;
	CONFIRM_RESET.disabled = true;
})

function setAllInputs(section, enable = false) {
	section.querySelectorAll(".item").forEach(item => {
		const i = enable ? Array.from(item.querySelectorAll("input")).at(-1) : item.querySelector("input");

		if (i.type === "checkbox") i.checked = enable;	// will cascade to all neighboring boxes
		else i.value = enable ? i.max : i.min;	// no cascade needed

		i.dispatchEvent(new Event("change"));
	})
}
// #endregion Tracking
